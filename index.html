  <!-- Inline script to apply theme immediately for Safari compatibility -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme") || "light";
        var html = document.documentElement;
        html.setAttribute("data-theme", theme);
        if (theme === "dark") {
          html.classList.add("dark-theme");
          html.classList.remove("light-theme");
          // Set inline bg for Safari to prevent flash
          html.style.backgroundColor = "#111b2b";
        } else {
          html.classList.add("light-theme");
          html.classList.remove("dark-theme");
          html.style.backgroundColor = "#fffbf7";
        }
      } catch (e) {
        // Fallback if localStorage is not available
      }
    })();

    // Classic is the default. ?plain / ?classic in the URL win,
    // then the visitor's saved choice.
    (function () {
      var plain = false;
      if (/[?&]plain\b/.test(location.search)) plain = true;
      else if (/[?&]classic\b/.test(location.search)) plain = false;
      else {
        try {
          plain = localStorage.getItem("siteStyle") === "plain";
        } catch (e) {}
      }
      if (plain) document.documentElement.classList.add("plain-mode");
    })();
  </script>

  <!-- Content Loading Script -->
  <script type="text/javascript">
    let siteContent = null;

    // Intersection Observer for fade-up animations
    function initAnimations() {
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.1,
          rootMargin: "0px 0px -50px 0px",
        }
      );

      document.querySelectorAll(".fade-up").forEach((el) => {
        observer.observe(el);
      });
    }

    // Load content from JSON
    async function loadContent() {
      try {
        const response = await fetch("./content/content.json", { cache: "no-cache" });
        siteContent = await response.json();
        populateContent();
      } catch (error) {
        console.error("Failed to load content:", error);
      }
    }

    // Populate all sections with content from JSON
    function populateContent() {
      if (!siteContent) return;

      const c = siteContent;
      const ext = (url, text, cls = "") =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer"${cls ? ` class="${cls}"` : ""}>${text}</a>`;
      const social = (platform) => c.header.socialLinks.find((l) => l.platform === platform);
      const resume = social("resume");

      // Header
      const profileImage = document.getElementById("profileImage");
      profileImage.src = c.header.profileImage;
      profileImage.alt = `Photo of ${c.header.name}`;
      const nameParts = c.header.name.split(" ");
      document.getElementById("userName").innerHTML =
        `${nameParts[0]} <span class="name-accent">${nameParts.slice(1).join(" ")}</span>`;
      document.getElementById("userName").setAttribute("data-pronunciation", c.header.nameAudio);
      document.getElementById("userLocation").textContent = c.header.location;

      // Social icons (resume gets its own labelled button instead of an icon)
      document.getElementById("dico").innerHTML = c.header.socialLinks
        .filter((link) => link.platform !== "resume")
        .map((link) =>
          `<a href="${link.url}" target="_blank" rel="noopener noreferrer" aria-label="${link.platform}" title="${link.platform}"><i class="${link.icon}" aria-hidden="true"></i></a>`)
        .join("");
      if (resume) document.getElementById("navResume").href = resume.url;

      // Last Updated
      document.getElementById("lastUpdated").textContent = `Last updated: ${c.info.lastUpdated}`;

      // Hero: who I am, what I do, and the next step, in one screen
      document.getElementById("heroHeadline").textContent = c.hero.headline;
      document.getElementById("heroCredentials").textContent = c.hero.credentials;
      document.getElementById("heroIntro").innerHTML = c.hero.intro;
      document.getElementById("heroAvailability").innerHTML =
        `<span class="availability-dot" aria-hidden="true"></span>${c.hero.availability}`;
      // GitHub already sits in the icon row under the photo, so the hero keeps two actions
      document.getElementById("heroCtas").innerHTML = [
        `<a href="#pet-projects" class="cta cta-primary">View projects</a>`,
        resume ? ext(resume.url, "Resume", "cta") : "",
      ].join("");

      // 600+ numbered courses are PhD-level, the rest master's-level
      const courseLevel = (course) =>
        parseInt((course.code.match(/(\d{3})/) || [])[1], 10) >= 600 ? "PhD-level" : "Master's-level";

      const courseworkFor = (entry) => {
        if (!entry.coursework) return "";
        // Handle both array format (multiple semesters) and object format (single semester)
        const semesters = Array.isArray(entry.coursework) ? entry.coursework : [entry.coursework];
        // Grouped by level (PhD-level first); "*" marks courses in progress
        const groups = [];
        semesters.forEach((sem) => sem.categories.forEach((category) => category.courses.forEach((course) => {
          const label = courseLevel(course);
          let group = groups.find((g) => g.label === label);
          if (!group) groups.push(group = { label, courses: [] });
          group.courses.push(course);
        })));
        groups.sort((a, b) => (a.label === "PhD-level" ? -1 : 0) - (b.label === "PhD-level" ? -1 : 0));
        const anyCurrent = groups.some((g) => g.courses.some((course) => course.current));
        return `<div class="edu-courses">${groups.map((g) => `
          <div class="edu-sem">
            <div class="edu-sem-label">${g.label}</div>
            <ul class="edu-course-list">
              ${g.courses.map((course) => `
                <li>
                  <span class="edu-course-name">${course.name}${course.current ? '<span class="edu-current" title="currently taking">*</span>' : ""}</span>
                  <span class="edu-course-code">${course.code}</span>
                </li>`).join("")}
            </ul>
          </div>`).join("")}
          ${anyCurrent ? `<div class="edu-footnote">* currently taking</div>` : ""}
        </div>`;
      };

      const orgHTML = (entry) => entry.org
        ? ` <span class="exp-org">· ${entry.orgUrl ? ext(entry.orgUrl, entry.org) : entry.org}</span>`
        : "";

      // Experience (degrees live in the Education section further down)
      document.getElementById("history").innerHTML = `
        <div class="ctitle">experience</div>
        ${c.history.entries.filter((e) => e.type !== "education").map((entry) => {
          const skillsHTML = entry.skills?.length
            ? `<div class="exp-skills">${entry.skills.map((s) => `<span class="skill-chip">${s}</span>`).join("")}</div>`
            : "";
          const bulletsHTML = entry.bullets?.length
            ? `<ul class="exp-bullets">${entry.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`
            : "";
          const moreHTML = bulletsHTML
            ? `<details class="exp-more">
                <summary><span class="exp-more-closed">see more</span><span class="exp-more-open">see less</span></summary>
                ${bulletsHTML}
              </details>`
            : "";
          return `
        <div class="entry row">
          <div class="timespan">${entry.timespan}</div>
          <div class="ico">
            <div class="entry-dot"></div>
            <img src="${entry.logo}" alt="${entry.org || entry.role} logo" />
          </div>
          <div class="desc">
            <div class="exp-head">
              <strong>${entry.role}</strong>${orgHTML(entry)}
              ${entry.note ? `<span class="exp-note">${entry.note}</span>` : ""}
            </div>
            <div class="exp-date-inline">${entry.timespan}</div>
            ${entry.summary ? `<div class="exp-summary">${entry.summary}</div>` : ""}
            ${skillsHTML}
            ${moreHTML}
          </div>
        </div>`;
        }).join("")}
      `;

      // Selected work: four featured projects up front, or every project in one area
      const projectsContainer = document.getElementById("pet-projects");
      const projects = c.projects;
      const allProjects = ProjectsUI.sorted(projects.items);
      const featuredProjects = ProjectsUI.featured(projects.items);
      const projectsFor = (filter) => filter === "featured"
        ? featuredProjects
        : allProjects.filter((p) => p.category === filter);
      projectsContainer.innerHTML = `
        <div class="ctitle fade-up">selected work</div>
        <div class="fade-up">${ProjectsUI.filterBar(projects, "featured",
          { id: "featured", label: "featured", count: featuredProjects.length }, { hide: ["archive"] })}</div>
        <div class="feature-list" id="projectsGrid">
          ${projectsFor("featured").map((p) => ProjectsUI.featureRow(p, { projects })).join("")}
        </div>
        <p class="fade-up view-all-row">
          <a href="projects.html" class="view-all-projects" id="viewAllProjects">→ all ${projects.items.length} projects, with details</a>
        </p>
      `;
      ProjectsUI.onFilter(projectsContainer, (filter) => {
        projectsContainer.querySelectorAll("[data-filter]").forEach((b) =>
          b.setAttribute("aria-selected", String(b.dataset.filter === filter)));
        // Every tab uses the same rows; the area label only matters on "featured"
        document.getElementById("projectsGrid").innerHTML = projectsFor(filter)
          .map((p) => ProjectsUI.featureRow(p, filter === "featured" ? { projects } : {})).join("");
        document.getElementById("viewAllProjects").href =
          filter === "featured" ? "projects.html" : `projects.html#${filter}`;
      });

      // Research: interests + publications
      document.getElementById("research").innerHTML = `
        <div class="ctitle">${c.research.title}</div>
        <p class="research-intro">${c.research.intro}</p>
        <div class="section-label">Interests</div>
        <ul class="research-interests">${c.research.interests.map((i) => `<li>${i}</li>`).join("")}</ul>
        <div class="section-label">${c.publications.title}</div>
        ${c.publications.items.map((item) => `
          <div class="pub">
            <div class="pub-title">${item.url ? ext(item.url, item.title) : item.title}</div>
            <div class="pub-venue">${item.venue}</div>
            <div class="pub-authors">${item.authors}</div>
          </div>`).join("")}
      `;

      // Updates
      document.getElementById("miscContainer").innerHTML = `
        <div class="ctitle">${c.misc.title}</div>
        ${c.misc.items.map((item) => {
          let description = item.description || "";
          if (item.url && item.linkText) {
            const linkRegex = new RegExp(`(${item.linkText.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
            description = description.replace(linkRegex, ext(item.url, "$1"));
          } else if (item.url) {
            description = ext(item.url, description);
          }
          return `<div class="misc-item"><strong>${item.date}</strong> - ${description}</div>`;
        }).join("")}
      `;

      // Writing
      document.getElementById("writingContainer").innerHTML = `
        <div class="ctitle">${c.writing.title}</div>
        <div>${c.writing.subtitle}</div>
        <ul class="nodot">
          ${c.writing.articles.map((a) => `<li>${a.date} ${ext(a.url, a.title)}</li>`).join("")}
        </ul>
        <p class="writing-more"><a href="${c.writing.contentLink.url}">${c.writing.contentLink.text}</a></p>
      `;

      // Education: compact, near the bottom
      document.getElementById("education").innerHTML = `
        <div class="ctitle">education</div>
        ${c.history.entries.filter((e) => e.type === "education").map((entry) => {
          const coursework = courseworkFor(entry);
          return `
          <div class="edu-item">
            <img class="edu-logo" src="${entry.logo}" alt="${entry.org} logo" loading="lazy" />
            <div class="edu-body">
              <div class="edu-top">
                <div class="exp-head"><strong>${entry.role}</strong>${orgHTML(entry)}
                  ${entry.note ? `<span class="exp-note">${entry.note}</span>` : ""}</div>
                <div class="edu-date">${entry.timespan}</div>
              </div>
              ${entry.summary ? `<div class="exp-summary">${entry.summary}</div>` : ""}
              ${coursework}
            </div>
          </div>`;
        }).join("")}
      `;

      // Contact: a clear closing call to action
      document.getElementById("contact").innerHTML = `
        <div class="ctitle">${c.contact.title}</div>
        <p class="contact-text">${c.contact.text}</p>
        <div class="cta-row">
          <a href="mailto:${c.contact.email}" class="cta cta-primary">${c.contact.email}</a>
          ${social("linkedin") ? ext(social("linkedin").url, "LinkedIn", "cta") : ""}
          ${social("github") ? ext(social("github").url, "GitHub", "cta") : ""}
          ${resume ? ext(resume.url, "Resume", "cta") : ""}
        </div>
      `;

      try {
        renderPlainView();
      } catch (error) {
        console.error("Failed to render plain view:", error);
      }

      // Footer
      document.getElementById("footer").innerHTML = `
        ${siteContent.footer.attribution}
        <div>${siteContent.footer.tagline}</div>
      `;
    }

    // Plain version: browser-default HTML, one page per section (?plain=<page>)
    function renderPlainView() {
      const c = siteContent;
      const link = (url, text) =>
        `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      const list = (items, cls = "") =>
        `<ul${cls ? ` class="${cls}"` : ""}>${items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
      // Multi-line entries (jobs, degrees, projects) get vertical space between them
      const entries = (items) => list(items, "pv-entries");

      const coursework = (entry) => {
        if (!entry.coursework) return "";
        const semesters = Array.isArray(entry.coursework) ? entry.coursework : [entry.coursework];
        // Grouped by level; "*" marks courses in progress
        const levels = { "PhD-level": [], "Master's-level": [] };
        // 600+ numbered courses are PhD-level, the rest master's-level
        semesters.forEach((sem) => sem.categories.forEach((cat) => cat.courses.forEach((course) =>
          levels[parseInt((course.code.match(/(\d{3})/) || [])[1], 10) >= 600 ? "PhD-level" : "Master's-level"].push(course))));
        const anyCurrent = Object.values(levels).flat().some((course) => course.current);
        return "Coursework:" + list(Object.entries(levels)
          .filter(([, courses]) => courses.length)
          .map(([level, courses]) => `${level}: ` +
            courses.map((course) => `${course.name}${course.current ? "*" : ""}`).join(", "))) +
          (anyCurrent ? "<p><small>* currently taking</small></p>" : "");
      };

      const timeline = (items) => entries(items.map((e) =>
        `<b>${e.role}</b>${e.org ? `, ${e.orgUrl ? link(e.orgUrl, e.org) : e.org}` : ""}${e.note ? ` (${e.note})` : ""} <i>${e.timespan}</i>` +
        (e.summary ? `<p>${e.summary}</p>` : "") +
        (e.skills?.length ? `<p>Skills: ${e.skills.join(", ")}</p>` : "") +
        (e.bullets?.length ? list(e.bullets) : "") +
        coursework(e)
      ));

      const sortedProjects = ProjectsUI.sorted(c.projects.items);
      const projectAreas = (c.projects.categories || [])
        .filter((a) => sortedProjects.some((p) => p.category === a.id));

      const pages = {
        experience: {
          title: "Work Experience",
          intro: "My work and research experience, most recent first. My degrees and coursework are on the <a href=\"?plain=education\">education</a> page.",
          body: () => timeline(c.history.entries.filter((e) => e.type !== "education")),
        },
        education: {
          title: "Education",
          intro: "Where I studied, and the courses I've taken.",
          body: () => timeline(c.history.entries.filter((e) => e.type === "education")),
        },
        projects: {
          title: "Projects",
          intro: "Things I've built, grouped by area. Jump to: " +
            projectAreas.map((a) => `<a href="#area-${a.id}">${a.label}</a>`).join(", ") + ".",
          body: () => projectAreas.map((area) => `
            <h3 id="area-${area.id}">${area.label}</h3>
            ${entries(sortedProjects.filter((p) => p.category === area.id).map((p) => {
              const links = [
                p.url ? link(p.url, "repo") : "",
                p.demo ? link(p.demo, "demo") : "",
                p.report ? link(p.report, "report") : "",
              ].filter(Boolean).join(", ");
              return `<b>${p.name}</b>${p.status === "in-progress" ? " (in progress)" : ""}` +
                `${p.stack ? ` <i>${p.stack}</i>` : ""}` +
                `<p>${p.summary || `${p.name} ${p.description}`}${links ? ` (${links})` : ""}</p>` +
                (p.highlights?.length ? list(p.highlights) : "");
            }))}`).join(""),
        },
        publications: {
          title: "Publications",
          intro: "Research papers I've published.",
          body: () => list(c.publications.items.map((p) =>
            `<b>${p.url ? link(p.url, p.title) : p.title}</b><br><i>${p.venue}</i><br>${p.authors}`
          )),
        },
        writing: {
          title: "Writing",
          intro: `${c.writing.subtitle}.`,
          body: () => list(c.writing.articles.map((a) => `${a.date}: ${link(a.url, a.title)}`)),
        },
        updates: {
          title: "Updates",
          intro: "Things that happened recently.",
          body: () => list(c.misc.items.map((item) => {
            let d = item.description || "";
            if (item.url && item.linkText && d.includes(item.linkText)) {
              d = d.replace(item.linkText, link(item.url, item.linkText));
            } else if (item.url) {
              d = link(item.url, d);
            }
            return `<b>${item.date}</b>: ${d}`;
          })),
        },
      };

      const pageKey = new URLSearchParams(location.search).get("plain");
      const page = pages[pageKey];
      const fancyLink = `<p><small><a href="#" data-style="fancy">switch to the classic version</a></small></p>`;
      const plain = document.getElementById("plainView");

      if (page) {
        document.title = `${c.header.name}: ${page.title}`;
        plain.innerHTML = `
          <h2><a href="?plain" class="sitenav">${c.header.name}</a> &gt; ${page.title}</h2>
          <p>${page.intro}</p>
          ${page.body()}
          ${fancyLink}
        `;
      } else {
        const social = c.header.socialLinks.map((s) => link(s.url, s.platform));
        plain.innerHTML = `
          <img src="${c.header.profileImage}" alt="${c.header.name}" class="pv-photo" />
          <h2>${c.header.name}</h2>
          <p>${c.plain.intro}</p>

          Some things about me:
          ${list(c.plain.about)}

          Site navigation:
          ${list([
            `Timeline of my <a href="?plain=experience">work experience</a>`,
            `My <a href="?plain=education">educational background</a> and coursework`,
            `Some <a href="?plain=projects">projects</a> I've built`,
            `My published <a href="?plain=publications">research papers</a>`,
            `Things I've <a href="?plain=writing">written</a>`,
            `Recent <a href="?plain=updates">updates</a>`,
            `Elsewhere: ${social.slice(0, -1).join(", ")}, and my ${social[social.length - 1]}`,
          ])}

          <span>${c.plain.contact}</span>
          ${fancyLink}
        `;
      }

      plain.querySelectorAll("[data-style]").forEach((a) =>
        a.addEventListener("click", (e) => {
          e.preventDefault();
          setSiteStyle(a.dataset.style);
        }));
    }

    // style: "fancy" (classic) or "plain"
    function setSiteStyle(style) {
      document.documentElement.classList.toggle("plain-mode", style === "plain");
      try {
        localStorage.setItem("siteStyle", style);
      } catch (e) {}
      if (/[?&](plain|classic)\b/.test(location.search)) {
        history.replaceState(null, "", location.pathname);
      }
      if (siteContent) {
        document.title = siteContent.header.name;
        if (style === "plain") renderPlainView();
      }
      window.scrollTo(0, 0);
    }

    document.getElementById("styleToggle").addEventListener("click", () => setSiteStyle("plain"));

    // Load content on page load
    loadContent().then(() => {
      // Initialize animations after content is loaded and DOM is populated
      setTimeout(initAnimations, 100);
    });
  </script>

  <!-- Dark Mode Toggle Functionality -->
  <script type="text/javascript">
    // Dark mode toggle functionality with Safari compatibility
    const themeToggle = document.getElementById("themeToggle");
    const sunElements = document.querySelectorAll(".sun");
    const moonElement = document.querySelector(".moon");

    // Check for saved theme preference or default to light mode
    let currentTheme;
    try {
      currentTheme = localStorage.getItem("theme") || "light";
    } catch (e) {
      // Fallback if localStorage is not available
      currentTheme = "light";
    }

    // Apply theme with Safari compatibility
    function applyTheme(theme) {
      const htmlEl = document.documentElement;
      const bodyEl = document.body;

      // Set the attribute and classes
      htmlEl.setAttribute("data-theme", theme);

      if (theme === "dark") {
        htmlEl.classList.add("dark-theme");
        htmlEl.classList.remove("light-theme");
        if (bodyEl) {
          bodyEl.classList.add("dark-theme");
          bodyEl.classList.remove("light-theme");
        }
      } else {
        htmlEl.classList.add("light-theme");
        htmlEl.classList.remove("dark-theme");
        if (bodyEl) {
          bodyEl.classList.add("light-theme");
          bodyEl.classList.remove("dark-theme");
        }
      }

      // Safari fix: force a full style recalculation by briefly
      // setting explicit inline styles, then removing them so CSS
      // custom properties take over properly
      if (bodyEl) {
        var colors = theme === "dark"
          ? { bg: "#111b2b", text: "#e6f1ff" }
          : { bg: "#fffbf7", text: "#1a1a1a" };

        bodyEl.style.backgroundColor = colors.bg;
        bodyEl.style.color = colors.text;

        // Force reflow
        void bodyEl.offsetHeight;

        // Double rAF to ensure Safari fully repaints
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            bodyEl.style.backgroundColor = "";
            bodyEl.style.color = "";
          });
        });
      }

      // Save to localStorage
      try {
        localStorage.setItem("theme", theme);
      } catch (e) {
        console.warn("Could not save theme preference");
      }
    }

    // Update toggle icon based on current theme
    function updateToggleIcon(theme) {
      if (theme === "dark") {
        sunElements.forEach((el) => (el.style.display = "none"));
        moonElement.style.display = "block";
      } else {
        sunElements.forEach((el) => (el.style.display = "block"));
        moonElement.style.display = "none";
      }
    }

    // Initialize theme and icon state
    // Ensure theme is applied on DOM ready for Safari
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        applyTheme(currentTheme);
        updateToggleIcon(currentTheme);
      });
    } else {
      applyTheme(currentTheme);
      updateToggleIcon(currentTheme);
    }

    // Toggle theme
    themeToggle.addEventListener("click", function () {
      const currentTheme =
        document.documentElement.getAttribute("data-theme") ||
        (document.documentElement.classList.contains("dark-theme")
          ? "dark"
          : "light");
      const newTheme = currentTheme === "dark" ? "light" : "dark";

      applyTheme(newTheme);
      updateToggleIcon(newTheme);
    });

    // Info icon tooltip is handled via CSS hover
  </script>

  <!-- UMass Amherst Web Ring Integration -->
  <script type="text/javascript">
    const WEBRING_USERNAME = 'devaanand19';
    const WEBRING_API_URL = `https://umaring.mkr.cx/${WEBRING_USERNAME}`;

    async function loadWebring() {
      // Skip if username is not set
      if (WEBRING_USERNAME === 'YOUR_USERNAME') {
        return;
      }

      try {
        const response = await fetch(WEBRING_API_URL);
        if (!response.ok) {
          throw new Error('Failed to fetch webring data');
        }

        const data = await response.json();

        // Update previous link
        const prevLink = document.getElementById('webring-prev');
        if (data.prev && prevLink) {
          prevLink.href = data.prev.url;
          prevLink.textContent = `← ${data.prev.name}`;
          prevLink.style.display = 'inline-block';
          prevLink.title = `Previous: ${data.prev.name}`;
        }

        // Update next link
        const nextLink = document.getElementById('webring-next');
        if (data.next && nextLink) {
          nextLink.href = data.next.url;
          nextLink.textContent = `${data.next.name} →`;
          nextLink.style.display = 'inline-block';
          nextLink.title = `Next: ${data.next.name}`;
        }

        // Show webring container
        const webringContainer = document.getElementById('umass-webring');
        if (webringContainer) {
          webringContainer.style.display = 'block';
        }
      } catch (error) {
        console.error('Failed to load webring:', error);
        // Hide webring on error
        const webringContainer = document.getElementById('umass-webring');
        if (webringContainer) {
          webringContainer.style.display = 'none';
        }
      }
    }

    // Load webring on page load
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", loadWebring);
    } else {
      loadWebring();
    }
  </script>
