<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="End-to-end ETL runtime">
<rect width="640" height="400" fill="#fcfcfb"/>
<text x="32" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b">End-to-end ETL runtime</text>
<text x="32" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#52514e">NYC TLC taxi data, ~1.4B records · minutes · naive vs. tuned pipeline</text>
<line x1="150.0" y1="110" x2="150.0" y2="290" stroke="#e4e3df"/>
