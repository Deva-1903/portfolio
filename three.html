<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
  <title>Deva Anand — 3D Mode</title>
  <meta name="description" content="An interactive, futuristic 3D version of Deva Anand's portfolio." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="./styles/three.css" />

  <!-- Apply saved theme immediately to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <!-- Three.js (ES modules via import map) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <!-- Loading overlay -->
  <div id="loader" class="loader">
    <div class="loader-core"></div>
    <div class="loader-text">building the scene</div>
  </div>

  <!-- WebGL background (particles + interactive 3D object) -->
  <div id="webgl" class="layer webgl-layer"></div>

  <!-- CSS3D content (floating panels + project cards) -->
  <div id="css3d" class="layer css3d-layer"></div>

  <!-- Fixed UI overlay -->
  <header class="ui-top">
    <a href="./index.html" class="pill back-pill" id="backBtn" aria-label="Back to classic portfolio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
      <span>Back to Classic Portfolio</span>
    </a>

    <div class="ui-top-right">
      <button class="pill icon-pill" id="themeToggle3d" aria-label="Toggle light / dark scene">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4">
          </path>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Section navigation -->
  <nav class="section-nav" id="sectionNav" aria-label="Sections"></nav>

  <!-- Prev / next controls -->
  <div class="section-controls">
    <button class="pill icon-pill nav-arrow" id="prevBtn" aria-label="Previous section" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M18 15l-6-6-6 6"></path>
      </svg>
    </button>
    <span class="section-index" id="sectionIndex">01 / 05</span>
    <button class="pill icon-pill nav-arrow" id="nextBtn" aria-label="Next section">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6"></path>
      </svg>
    </button>
  </div>

  <!-- Scroll / swipe hint -->
  <div class="scroll-hint" id="scrollHint">
    <span>scroll, swipe, or use ← → to fly through</span>
  </div>

  <!-- WebGL-unsupported fallback -->
  <div id="noWebgl" class="no-webgl" hidden>
    <h1>3D mode needs WebGL</h1>
    <p>Your browser or device couldn't start the 3D scene.</p>
    <a href="./index.html" class="pill back-pill"><span>← Back to Classic Portfolio</span></a>
  </div>

  <script type="module" src="./assets/three-app.js"></script>
</body>

</html>
